[project]
name = "nicewebrl-overcooked-cec"
version = "0.1.0"
description = "Cross-Environment Cooperation example for NiceWebRL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nicewebrl @ git+https://github.com/Uwonsang/nicewebrl-cec.git",
    "jaxmarl @ git+https://github.com/Uwonsang/crossenv_ued.git",
    "aiohttp",
    "requests",
    "scipy",
    "jax[cuda12-pip]>=0.4.26",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88

[tool.uv]
find-links = ["https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"]

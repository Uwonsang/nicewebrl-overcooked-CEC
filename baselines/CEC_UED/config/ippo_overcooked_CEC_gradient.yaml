"ENV_NAME": "overcooked"  # ToyCoop or overcooked #checked
"LR": 3e-4 #checked
"WEIGHT_DECAY": 0.0001  # used by ippo_general_gradient_wd.py (AdamW)
"NUM_ENVS": 256
"NUM_SEEDS": 1
"NUM_STEPS": 400 #checked
"FC_DIM_SIZE": 256
"GRU_HIDDEN_DIM": 256
"TOTAL_TIMESTEPS": 3e9 #checked #for overcooked : 3e9
"MAX_TRAIN_STEPS": 3e9 #checked
"UPDATE_EPOCHS": 4 #checked
"NUM_MINIBATCHES": 2 #checked
"GAMMA": 0.99 #checked
"GAE_LAMBDA": 0.95 #checked
"CLIP_EPS": 0.2 #checked
"SCALE_CLIP_EPS": False
"ENT_COEF": 0.005 #checked
"VF_COEF": 1.0 #checked
"MOA_COEF": 1.0
"MAX_GRAD_NORM": 0.5 #checked
"ACTIVATION": "relu" #checked
"ANNEAL_LR": True
"SEED": 0
"ENV_KWARGS": 
  "random_reset" : True #checked # relevant for which env to train/test on. If true, it is CEC, otherwise single task
  "max_steps": 400
  "check_held_out": True  # if false, we don't check if the reset env is held out
  # toy specific kwargs
  "debug": False
  "partial_obs": False
  "incentivize_strat": 2 # choose [0, 1, 2, 3] for top, bottom, none, or multiple
  # overcooked specific kwargs
  "shuffle_inv_and_pot": True # if true, we shuffle pot status and inventory
  "layout": "cramped_room_9"  # relevant for overcooked, all CEC compatible envs have the "_9" in the name at the end
  "random_reset_fn": "reset_all"  # reset_all or reset_counter_circuit
"TRAINING": True
"TRAIN_KWARGS":
  "ckpt_id": 0 # loads from ckpt_id - 1 if available
  "overwrite_ckpt": True # if true, will overwrite ckpt_id
  "finetune": False # if true, load from opposing paradigm and cut learning rate by 10x
  "finetune_checkpoint_root": "../ICRL/CEC_IDAAC/256"
  "e3t_beta": 0.55  # how much randomness to add to probabilities of one partner. If 0 then it's completely uniform, if 1 then it's same as original, if higher than 1 we're magnifying the extremes
"TEST_KWARGS":
  "beta": 1.0
  "argmax": False  # otherwise we sample from policy
  "num_trajs": 2
  "plot": False  # if true, will get precedence over saving data
  "self_play": False  # get's full cross play matrix
  "ik": False # relevant to which model to load (ik vs sk)
  "debug": False
  "use_ckpt": True  # if true, will load from ckpt_id, otherwise will load from latest
"CONV_NET": True
"LSTM": True
"FCP": False
"FCP_KWARGS":
  "train_oracle": True
# WandB Params
"ENTITY": "overcooked_ai"                                          
"PROJECT": "crossenv_ued_gradient"
"WANDB_MODE" : "disabled"
"model_name": "CEC"
# EVAL Params
"EVAL_KWARGS":
  "num_envs": 5
  "num_steps": 400         
  "max_steps": 400
  "random_reset": False    
  "check_held_out": False  
  "shuffle_inv_and_pot": False
  "random_reset_fn": "reset_all"
  "beta": 1.0
  "argmax": False
  "eval_xp": True  # also cross-play each layout's agent against human_proxy (BC) checkpoints
  "human_proxy_ckpt_dir": "baselines/human_proxy/checkpoints"
  "human_proxy_num_seeds": 5
# for gradient conflict
"GRAD_CONFLICT_WINDOW_STEPS": 32  # rollout prefix used by gradient diagnostics
"GRAD_CONFLICT_CHUNK_SIZE": 64  # must evenly divide NUM_ENVS (one sample contains both actors)
"POPART_ALPHA": 0.01
"FIXED_TARGET_SCALE": 30.0  # critic learns raw value / this fixed positive scale
"SHARPNESS":
  "EPSILONS": [0.001, 0.0005]  # Keskar et al. (2017), Tables 3 and 4
  "LBFGSB_MAXITER": 10       # inexact maximization used by the paper
  "NUM_ACTORS": 16           # evenly sampled recurrent actor trajectories
  "NUM_STEPS": 400           # fixed post-training rollout horizon
"CRITIC_LOSS_SURFACE":
  "SNAPSHOT_FRACTIONS":
    "early": 0.1
    "middle": 0.5
    "final": 1.0
  "NUM_ACTORS": 16           # evenly sampled intact trajectories per snapshot
"RESUME_XPID": ""  # set to xpid string (e.g. "lr-20240608-143022") to resume that run

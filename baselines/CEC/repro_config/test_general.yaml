"ENV_NAME": "overcooked"  # ToyCoop or overcooked
"LR": 3e-4
"NUM_ENVS": 512
"NUM_SEEDS": 1
"NUM_STEPS": 400
"FC_DIM_SIZE": 256
"GRU_HIDDEN_DIM": 256
"TOTAL_TIMESTEPS": 3e9 # 3e9 for overcooked
"MAX_TRAIN_STEPS": 3e9
"UPDATE_EPOCHS": 4
"NUM_MINIBATCHES": 2
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"SCALE_CLIP_EPS": False
"ENT_COEF": 0.005
"VF_COEF": 1.0
"MOA_COEF": 1.0
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "relu"
"ANNEAL_LR": True
"SEED": 0
"ENV_KWARGS": 
  "random_reset" : False # relevant for which env to train/test on. If true, it is CEC, otherwise single task
  "max_steps": 400
  "check_held_out": False  # if false, we don't check if the reset env is held out
  # toy specific kwargs
  "debug": False
  "partial_obs": False
  "incentivize_strat": 2 # choose [0, 1, 2, 3] for top, bottom, none, or multiple
  # overcooked specific kwargs
  "shuffle_inv_and_pot": False # if true, we shuffle pot status and inventory
  "layout": "coord_ring_9"  # relevant for overcooked, all CEC compatible envs have the "_9" in the name at the end
  "random_reset_fn": "reset_all"  # reset_all or reset_counter_circuit
"TRAINING": True
"TRAIN_KWARGS":
  "ckpt_id": 0 # loads from ckpt_id - 1 if available
  "overwrite_ckpt": True # if true, will overwrite ckpt_id
  "finetune": False # if true, load from opposing paradigm and cut learning rate by 10x
  "e3t_beta": 0.55  # how much randomness to add to probabilities of one partner. If 0 then it's completely uniform, if 1 then it's same as original, if higher than 1 we're magnifying the extremes
"TEST_KWARGS":
  "beta": 1.0
  "argmax": False  # otherwise we sample from policy
  "num_trajs": 10
  "plot": False  # if true, will get precedence over saving data
  "self_play": False  # get's full cross play matrix
  "ik": False # relevant to which model to load (ik vs sk)
  "debug": False
  "use_ckpt": True  # if true, will load from ckpt_id, otherwise will load from latest
"CONV_NET": True
"LSTM": True
"FCP": False
"FCP_KWARGS":
  "train_oracle": True
"MODEL_PATH": "/mnt/nas/wonsang/crossenv_ued/models/ICRL"
"MODEL_NUM_ENVS": 256  # CEC and CEC_IDAAC checkpoint subdirectory
"SAVE_PATH": "artifacts/test_general_icrl"
"OUTPUT_DIR": null  # optional exact output directory
"HUMAN_PROXY_CKPT_DIR": "baselines/human_proxy/checkpoints"
"HUMAN_PROXY_NUM_SEEDS": 5  # matches training-time evaluation (BC seeds 0-4)
"NUM_MODELS": 6
"MODEL_SEEDS": null  # optional explicit checkpoint seed list
"XP_ONLY": True
# WandB Params
"ENTITY": "overcooked_ai"                                          
"PROJECT": "crossenv_ued"
"WANDB_MODE" : "disabled" # disabled, online, offline
"model_name": "IPPO" # CEC, CEC_Finetune, CEC_IDAAC, CEC_IDAAC_Finetune, E3T, FCP, FCP_Fixed, IPPO
